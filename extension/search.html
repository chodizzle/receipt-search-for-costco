<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Search for Costco</title>
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <header>
    <h1>Receipt Search for Costco</h1>
    <div class="sync">
      <span id="status">No receipts synced yet.</span>
      <button id="sync">Sync</button>
      <button id="fullsync" class="secondary" title="Re-download everything">Full resync</button>
      <button id="open-settings" class="secondary" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <input id="q" type="search" placeholder="Search items — e.g. &quot;kirkland paper towel&quot;, item # 1234567" autofocus>
      <select id="year"><option value="">All dates</option></select>
      <select id="source">
        <option value="">Warehouse + online</option>
        <option value="warehouse">Warehouse only</option>
        <option value="online">Online only</option>
        <option value="gas">Gas &amp; car wash only</option>
      </select>
      <div class="toggle">
        <label><input type="radio" name="view" value="lines" checked> Every purchase</label>
        <label><input type="radio" name="view" value="grouped"> Group by item</label>
      </div>
      <button id="csv" class="secondary">Export CSV</button>
    </div>
    <p id="summary"></p>
    <table id="results"><thead></thead><tbody></tbody></table>
    <p id="more" hidden></p>
  </main>

  <footer>Independent project — not affiliated with, endorsed by, or sponsored by Costco Wholesale Corporation. Your data stays in this browser.</footer>

  <dialog id="receipt">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <div id="receipt-body"></div>
  </dialog>

  <dialog id="settings">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <h2>Settings</h2>
    <label class="setting">
      <input type="checkbox" id="set-autoSync">
      <span><strong>Auto-sync</strong><br>
        <span class="desc2">When you open Orders &amp; Purchases on Costco, quietly pull new receipts (at most every 6 hours, after your first manual sync).</span></span>
    </label>
    <label class="setting">
      <input type="checkbox" id="set-includeGas">
      <span><strong>Include gas &amp; car wash</strong><br>
        <span class="desc2">Show gas station and car wash purchases in search results and totals.</span></span>
    </label>
  </dialog>

  <script src="search.js"></script>
</body>
</html>
